spring:
  application:
    name: property-management-system

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  sql:
    init:
      mode: never

  # ── Database ────────────────────────────────────────────────────────────────
  # Local:    DATABASE_URL=jdbc:postgresql://localhost:5432/propertydb
  # Supabase pooler (Render): DATABASE_URL=jdbc:postgresql://<host>.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
  # prepareThreshold=0 disables server-side prepared statements — required for
  # PgBouncer transaction mode (Supabase pooler port 6543).
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/propertydb}
    username: ${DB_USERNAME:propertyuser}
    password: ${DB_PASSWORD:propertypass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Validate connection on borrow (prevents stale connection errors)
      connection-test-query: SELECT 1

  flyway:
    enabled: true
    locations: classpath:db/migration
    # An existing database without Flyway history is recorded as version 1, and V1 is not run on it.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # Flyway owns the schema (ADR-0015). Hibernate only checks that it matches.
      ddl-auto: ${DDL_AUTO:validate}
    # database-platform = Spring Boot way of setting dialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        # Also set dialect directly in hibernate properties.
        # In Hibernate 6, hibernate-spatial's SpatialTypeContributor calls
        # requireService(JdbcEnvironment) during metadata building, which
        # triggers a DB connection attempt to auto-detect dialect.
        # Setting dialect here explicitly prevents that metadata lookup.
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        # Batch lazy fetches across rows in a page to stop N+1 storms on list
        # endpoints (gap analysis BE-02). When PropertyMapper.toDTO touches a
        # lazy association for each row, Hibernate now issues a single IN-list
        # query per association per batch instead of one query per row.
        default_batch_fetch_size: 25
    open-in-view: false

  # ── File Upload ─────────────────────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}
      file-size-threshold: 2KB

  # ── Mail ────────────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  # ── Cache ───────────────────────────────────────────────────────────────────
  cache:
    type: simple
    cache-names:
      - properties
      - users
      - propertyTypes
      - roles

# ── Twilio ────────────────────────────────────────────────────────────────────
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
  auth-token: ${TWILIO_AUTH_TOKEN:your_auth_token}
  from-number: ${TWILIO_FROM_NUMBER:+1234567890}
  enabled: ${TWILIO_ENABLED:false}

# ── Server ────────────────────────────────────────────────────────────────────
# Render sets PORT automatically; local default 8080
server:
  port: ${PORT:8080}
  # Tomcat's RemoteIpValve applies X-Forwarded-* only when the request comes from an internal
  # proxy address (private ranges by default), so springdoc still sees the public host behind
  # Render. "framework" trusted the header from anyone, so any client could choose its own IP
  # and dodge per-IP limits. If the proxy is not on a private range, set
  # server.tomcat.remoteip.internal-proxies (RUNBOOK_S4).
  forward-headers-strategy: native
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.propertyapp: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: INFO
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
  file:
    name: ${LOG_FILE:logs/application.log}
    max-size: 10MB
    max-history: 7

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt:
  # Override in production with a strong 512-bit hex key
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5971}
  expiration: ${JWT_EXPIRATION:86400000}               # 24 h
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 d — web/default clients (X-Client-Type != MOBILE)
  refresh-expiration-mobile: ${JWT_REFRESH_EXPIRATION_MOBILE:7776000000}  # ~90 d — X-Client-Type: MOBILE only

# ── Application ───────────────────────────────────────────────────────────────
app:
  name: Property Management System
  version: 1.0.0
  description: Complete property listing and management platform

  # CORS: for Render set CORS_ALLOWED_ORIGINS=https://your-service.onrender.com
  # React Native bypasses browser CORS, but listing origins is good practice
  cors:
    # An allowlist, never "*" outside local (ProductionConfigGuard refuses it). The web BFF calls same-origin.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:19006}
    allowed-methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
    allowed-headers: "Authorization,Content-Type,Accept,X-Client-Type,X-Correlation-Id"
    exposed-headers: "Authorization,Link,X-Total-Count,X-Correlation-Id"
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    max-age: 3600

  # Guest contact and abuse protection (ADR-0007 Amendment 1)
  contact:
    guest-enabled: ${APP_CONTACT_GUEST_ENABLED:true}
  rate-limit:
    guest-inquiries-per-ip-per-hour: 5
    guest-contacts-per-ip-per-hour: 30
    guest-inquiries-per-email-per-day: 10
    # Per-address limits on sign-in, sign-up, codes and password reset (ADR-0008 Amendment 3).
    # Raised only for local end-to-end runs, which sign in many times from one address.
    auth:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      login-per-ip-per-15min: ${AUTH_RL_LOGIN:20}
      register-per-ip-per-hour: ${AUTH_RL_REGISTER:10}
      otp-send-per-ip-per-hour: ${AUTH_RL_OTP_SEND:10}
      otp-verify-per-ip-per-15min: ${AUTH_RL_OTP_VERIFY:30}
      mail-per-ip-per-hour: ${AUTH_RL_MAIL:5}
      mail-per-email-per-hour: ${AUTH_RL_MAIL_EMAIL:3}
      reset-per-ip-per-15min: ${AUTH_RL_RESET:10}
  turnstile:
    enabled: ${TURNSTILE_ENABLED:false}
    secret: ${TURNSTILE_SECRET:}
  security:
    # Comma-separated proxy addresses whose X-Forwarded-For is trusted. Empty: use the socket address.
    trusted-proxies: ${TRUSTED_PROXIES:}

  async:
    email:
      core-pool-size: 5
      max-pool-size: 20
      queue-capacity: 200
      keep-alive-seconds: 60
      thread-name-prefix: email-exec-

  verification:
    # Set to your Render URL in production via APP_BASE_URL
    base-url: ${APP_BASE_URL:http://localhost:8080}
    verify-endpoint: /api/auth/verify-email
    expiry-hours: 24

  base-url: ${APP_BASE_URL:http://localhost:8080}

  upload:
    dir: ${UPLOAD_DIR:uploads/}

  # ── Image storage (ADR-0016) ───────────────────────────────────────────────
  # local: files in app.upload.dir, served at <base-url>/uploads/ (dev and tests; lost on a Render redeploy).
  # s3: any S3-compatible bucket (Cloudflare R2 recommended, AWS S3, Backblaze B2, MinIO).
  # The database stores a key such as images/<uuid>.jpg; the API turns it into public-base-url/<key>,
  # so moving vendor or CDN means changing STORAGE_PUBLIC_BASE_URL, not the data.
  storage:
    type: ${STORAGE_TYPE:local}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    # Photo addresses on other hosts that a listing, profile or application may still point at.
    external-hosts: ${STORAGE_EXTERNAL_HOSTS:images.unsplash.com}
    max-pixels: ${STORAGE_MAX_PIXELS:50000000}
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:}
      region: ${STORAGE_S3_REGION:auto}
      bucket: ${STORAGE_S3_BUCKET:}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
      path-style: ${STORAGE_S3_PATH_STYLE:true}
    # One-off copy of old /uploads/ files into the configured storage: off | dry-run | apply.
    migrate: ${STORAGE_MIGRATE:off}

  pagination:
    default-page-size: 20
    max-page-size: 100

  otp:
    expiry-minutes: 5
    length: 6

  rating:
    # Seconds after inquiry creation before a buyer may rate (time-based safety net).
    # Production: 86400 (24 h). Override per-profile for testing.
    eligibility-seconds: ${RATING_ELIGIBILITY_SECONDS:86400}

  maintenance:
    # Cron for MaintenanceScheduler.runAll(). Production: every 30 min.
    cron: ${MAINTENANCE_CRON:0 */30 * * * *}
    # Inquiries older than this (seconds) are auto-transitioned NEW → CONTACTED.
    auto-contact-seconds: ${AUTO_CONTACT_SECONDS:86400}

  seed:
    demo-users: false

  listing:
    # false publishes straight to ACTIVE. Client's "configured approval process" (ADR-0005).
    approval-required: ${LISTING_APPROVAL_REQUIRED:true}

  # Admin user created on first startup if not present in DB
  admin:
    email: ${ADMIN_EMAIL:admin@propertyapp.com}
    password: ${ADMIN_PASSWORD:Admin@123}
    first-name: Admin
    last-name: User

# ── Actuator / Health ─────────────────────────────────────────────────────────
# Render health check polls: GET /actuator/health  →  {"status":"UP"}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: ${HEALTH_DETAILS:always}
  health:
    # Exclude mail from health so Render health check passes even when SMTP creds not set
    mail:
      enabled: ${HEALTH_MAIL_ENABLED:false}
    diskspace:
      enabled: true
  info:
    env:
      enabled: true

# Metadata shown at /actuator/info
info:
  app:
    name: Property Management System
    version: 1.0.0
    environment: ${SPRING_PROFILES_ACTIVE:local}

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true
    # Point Swagger UI directly at the explicit API docs URL so it doesn't
    # auto-resolve relative to the browser's current origin (localhost)
    url: /api-docs
  show-actuator: false
