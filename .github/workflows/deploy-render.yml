# Render cannot see pushes to this repo (its GitHub App is installed on a different account),
# so every push to main asks Render to deploy through the service's Deploy Hook.
name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-render
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$HOOK" || { echo "RENDER_DEPLOY_HOOK_URL secret is not set"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$HOOK&ref=${GITHUB_SHA}")
          echo "Render answered HTTP $code"
          test "$code" -ge 200 && test "$code" -lt 300
